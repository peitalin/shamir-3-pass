[package]
name = "shamir-3-pass"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
description = "Shamir 3-pass protocol (commutative encryption)"
readme = "README.md"
repository = "https://github.com/peitalin/shamir-3-pass-rs"
license = "Apache-2.0"
keywords = ["cryptography", "shamir", "protocol", "commutative", "wasm"]
categories = ["cryptography", "wasm"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
aead = ["dep:chacha20poly1305"]

[dependencies]
base64ct = { version = "1.6", features = ["alloc"] }
chacha20poly1305 = { version = "0.10", optional = true }
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
zeroize = { version = "1.8", features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
